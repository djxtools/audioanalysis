name: Deploy to user pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug: show build output and test auth
        run: |
          echo "WORKDIR: $(pwd)"
          echo "Listing repo root:"
          ls -la
          echo "Listing public (if any):"
          ls -la public || true
          echo "Listing dist (build output):"
          ls -la dist || true
          echo "Testing access to target repo:"
          GIT_ASKPASS=/bin/echo git ls-remote https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/djxtools/djxtools.github.io || true

      - name: Deploy to djxtools.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          publishing_dir: ./dist
          destination_repo: djxtools/djxtools.github.io
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          keep_files: false
